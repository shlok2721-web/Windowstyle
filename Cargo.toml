[workspace]
resolver = "3"
members = [
    "egui_explorer",
    "fm_app",
    "fm_crates/fm_behav",
    "fm_crates/fm_lifecycle",
    "fm_crates/fm_mime",
    "fm_crates/fm_notify",
    "fm_crates/fm_persist",
    "fm_crates/fm_settings",
    "fm_crates/fm_thumbs",
    "fm_crates/fm_tiers",
    "fm_crates/fm_trash",
    "fm_crates/fm_walk",
]

[workspace.package]
edition = "2024"
license = "MIT"

# Optimise the shipped executable across workspace crate boundaries. This only affects
# release builds; development builds keep their fast incremental iteration times.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Windowstyle needs eframe to run a full egui pass for a window whose compositor withholds
# frame callbacks (Hyprland, inactive workspace). See vendor/eframe/src/native/run.rs,
# marked "WINDOWSTYLE PATCH". Remove once upstream exposes an opt-in for this.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
