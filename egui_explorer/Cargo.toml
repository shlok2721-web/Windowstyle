[package]
name = "egui_explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.37.0"
fm_thumbs = { path = "../fm_crates/fm_thumbs" }
resvg = { version = "0.45", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
