[package]
name = "fm_notify"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Watch directories for changes (Linux inotify) with debouncing and event coalescing, for auto-refreshing file listings. No unsafe, no egui dependency."

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs", "event"] }

[dev-dependencies]
tempfile = "3"
