name: Rust CI

on:
  # Branch pushes and pull requests run CI; tag pushes are release-only.
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

# CI never needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev

      # Check only. The old workflow ran `cargo fmt` and pushed a commit to main
      # from CI, which rewrites history behind your back. Run `cargo fmt --all`
      # locally (or in a pre-commit hook) instead.
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        # Add `-- -D warnings` once the codebase is warning-free.
        run: cargo clippy --workspace --all-targets --locked

      - name: Test all crates and targets
        run: cargo test --workspace --all-targets --locked

      # Smoke test that release compiles. Real release builds happen in release.yml.
      - name: Build application release binary
        run: cargo build --release --locked -p fm_app

      - name: Upload release executable
        uses: actions/upload-artifact@v7
        with:
          name: windowstyle-linux-x86_64
          path: target/release/file-manager
          if-no-files-found: error
          retention-days: 14
