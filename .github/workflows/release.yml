name: Linux release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev

      - name: Build optimized application
        run: cargo build --release -p fm_app

      - name: Package release
        run: |
          mkdir -p dist
          install -Dm755 target/release/file-manager dist/file-manager
          cp README.md dist/README.md
          tar -C dist -czf file-manager-linux-x86_64.tar.gz file-manager README.md

      - name: Upload release executable
        uses: actions/upload-artifact@v4
        with:
          name: windowstyle-linux-x86_64-release
          path: dist/file-manager
          if-no-files-found: error
          retention-days: 14

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: windowstyle-linux-x86_64-archive
          path: file-manager-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: file-manager-linux-x86_64.tar.gz
